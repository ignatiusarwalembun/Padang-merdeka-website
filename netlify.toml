[build]
  command = "node scripts/restore-assets.js"
  publish = "frontend"

[[redirects]]
  from = "/console"
  to = "/restaurant-console.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
